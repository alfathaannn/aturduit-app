<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Credit Card peeking from behind -->
  <rect x="14" y="9" width="30" height="12" rx="3.5" fill="url(#cardGrad)" opacity="0.95"/>
  <rect x="18" y="12" width="8" height="2" rx="1" fill="#0284c7" opacity="0.6"/>

  <!-- Main Wallet Body -->
  <rect x="6" y="15" width="52" height="38" rx="9" fill="url(#walletGrad)" filter="url(#shadow)"/>

  <!-- Wallet Seam Line -->
  <path d="M6 25 Q32 26 58 25" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>

  <!-- Wallet Flap / Pocket Clasp -->
  <path d="M36 24 H58 C60.2 24 62 25.8 62 28 V38 C62 40.2 60.2 42 58 42 H36 C33.8 42 32 40.2 32 38 V28 C32 25.8 33.8 24 36 24 Z" fill="url(#flapGrad)"/>
  
  <!-- Shiny Clasp Button -->
  <circle cx="47" cy="33" r="4" fill="#fbbf24"/>
  <circle cx="47" cy="33" r="2" fill="#d97706"/>
</svg>

